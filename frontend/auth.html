<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoxCampus — Login</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="auth-page">

  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="auth-wrapper">
    <!-- Brand -->
    <div class="auth-brand">
      <div class="auth-logo">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="20" fill="url(#authGrad)"/>
          <path d="M12 20 Q20 10 28 20 Q20 30 12 20Z" fill="white" opacity="0.9"/>
          <circle cx="20" cy="20" r="4" fill="white"/>
          <defs>
            <linearGradient id="authGrad" x1="0" y1="0" x2="40" y2="40">
              <stop offset="0%" stop-color="#6C63FF"/>
              <stop offset="100%" stop-color="#3ECFCF"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1 class="auth-brand-name">VoxCampus</h1>
      <p class="auth-brand-sub">Voice-Based University Assistant</p>
    </div>

    <!-- Card -->
    <div class="auth-card">
      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Error / Success messages -->
      <div id="auth-message" class="auth-message hidden"></div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrap">
            <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required />
            <button type="button" class="toggle-pw" onclick="togglePassword('login-password', this)">👁️</button>
          </div>
        </div>
        <button type="submit" class="btn-auth" id="login-btn">
          <span>Login</span>
        </button>
        <p class="auth-switch">Don't have an account? <a onclick="switchTab('register')">Register here</a></p>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="auth-form hidden" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="reg-name" class="form-input" placeholder="Your full name" required />
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrap">
            <input type="password" id="reg-password" class="form-input" placeholder="Create a password (min 6 chars)" required minlength="6" />
            <button type="button" class="toggle-pw" onclick="togglePassword('reg-password', this)">👁️</button>
          </div>
        </div>
        <button type="submit" class="btn-auth" id="register-btn">
          <span>Create Account</span>
        </button>
        <p class="auth-switch">Already have an account? <a onclick="switchTab('login')">Login here</a></p>
      </form>

      <!-- Continue as Guest -->
      <div class="auth-divider"><span>or</span></div>
      <button class="btn-guest" onclick="continueAsGuest()">Continue as Guest</button>
    </div>

    <p class="auth-footer">🎓 Chitkara University · AI-103 Project 2026</p>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
